name: Bofors-bevakaren

on:
  schedule:
    # Tider i UTC. Körningarna köar efter varandra, så hela matchdagen täcks.
    - cron: "40 9 * * *"
    - cron: "40 13 * * *"
    - cron: "40 16 * * *"
  workflow_dispatch:
    inputs:
      lage:
        description: "Vad ska köras?"
        type: choice
        options: [bevaka, test]
        default: bevaka

permissions:
  contents: write

concurrency:
  group: bevakare
  cancel-in-progress: false

jobs:
  bevaka:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOPIC_LEAGUE: ${{ secrets.NTFY_TOPIC_LEAGUE }}
    steps:
      - uses: actions/checkout@v4

      - name: Testa
        if: ${{ github.event.inputs.lage == 'test' }}
        run: |
          python3 bofors.py test
          python3 bofors.py next

      - name: Bevaka matcher
        if: ${{ github.event.inputs.lage != 'test' }}
        run: python3 bofors.py ci

      - name: Spara läge
        if: always()
        run: |
          date -u +%F > last_run.txt
          touch state.json
          git config user.name "bofors-bevakaren"
          git config user.email "actions@users.noreply.github.com"
          git add state.json last_run.txt
          git commit -m "Uppdatera läge" || exit 0
          git pull --rebase || true
          git push
